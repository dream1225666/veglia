name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          # 安装脚本所需的 Android 34 平台和构建工具
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | $SDKMANAGER --licenses
          yes | $SDKMANAGER "platforms;android-34" "build-tools;34.0.0"

      - name: Make build script executable
        run: chmod +x android/build.sh

      - name: Build APK using custom script
        run: |
          cd android
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veglia-apk
          path: android/Veglia.apk
